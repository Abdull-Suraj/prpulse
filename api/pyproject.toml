[project]
name = "prpulse-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdullahi", email = "abdullahisuraj911@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "boto3>=1.43.114",
    "fastapi[standard]>=0.143.2",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "supabase>=2.33.0",
    "tenacity>=9.2.1",
    "unidiff>=1.0.1",
]

[project.scripts]
prpulse-api = "prpulse_api:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ['.']
asyncio_mode = 'auto'

[tool.mypy]
ignore_missing_imports = true